# 포트폴리오 블로그 RSS에서 최근 글 목록을 README에 매일 갱신
name: Update recent posts

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: https://kkokkiyo.github.io/rss.xml
          max_post_count: 5
          commit_message: Update recent posts
